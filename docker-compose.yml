# Postgres local (opcional, se usar Docker). Lê as variáveis do arquivo .env
services:
  db:
    image: postgres:16
    container_name: acompanhamento_semanal_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
